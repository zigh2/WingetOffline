name: Apply incoming package

on:
  push:
    branches: [main]
    paths: ['incoming/*.zip']

permissions:
  contents: write

concurrency:
  group: apply-incoming
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace project files from zip
        id: apply
        run: bash .github/scripts/apply-incoming.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build core projects (safety gate before pushing)
        run: |
          dotnet build src/WingetOffline.Builder -c Release
          dotnet build src/WingetOffline.Cli -c Release

      - name: Unit tests (best effort; the Windows CI is the real gate)
        continue-on-error: true
        run: dotnet test tests/WingetOffline.Tests -c Release

      - name: Build WPF app (best effort on Linux; full build runs in CI on Windows)
        continue-on-error: true
        run: dotnet build src/WingetOffline.App -c Release -p:EnableWindowsTargeting=true

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore: apply incoming package (v${{ steps.apply.outputs.version }})"
          git push