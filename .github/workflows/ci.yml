name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['incoming/**', '**.md']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest   # غيّرها إلى windows-latest عند إضافة واجهة WPF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build WingetOffline.sln -c Release
