name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['incoming/**', '**.md']
  pull_request:
  workflow_dispatch:      # تشغيل يدوي من تبويب Actions

jobs:
  build:
    runs-on: windows-latest   # مطلوب لمشروع WPF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build WingetOffline.sln -c Release
      - name: Unit tests
        run: dotnet test tests/WingetOffline.Tests -c Release --no-build --logger "console;verbosity=normal"
